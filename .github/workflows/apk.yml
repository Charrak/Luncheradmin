name: Android APKs bauen

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  apk:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Betreuer-App
            directory: SeniorenBeheerder
            artifact: Seniorenverwaltung-Betreuer-Debug-APK
            platform: platforms;android-36.1
          - name: Senioren-Launcher
            directory: SeniorenLauncher
            artifact: Senioren-Launcher-Debug-APK
            platform: platforms;android-36

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v4

      # Der Launcher verlangt im Gradle-Daemon-Kriterium ausdrücklich JetBrains JDK 21.
      - name: JDK 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Android-Plattform und Build-Tools installieren
        run: sdkmanager '${{ matrix.platform }}' 'build-tools;36.0.0' 'build-tools;36.1.0'

      - name: Gradle-Cache einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Gradle-Wrapper ausführbar machen
        working-directory: ${{ matrix.directory }}
        run: chmod +x gradlew

      - name: Tests ausführen und Debug-APK bauen
        working-directory: ${{ matrix.directory }}
        run: >-
          ./gradlew :app:testDebugUnitTest :app:assembleDebug
          --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8"
          -Pkotlin.compiler.execution.strategy=in-process

      - name: APK als Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.directory }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
