name: APK abholen (temporär)

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  holen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Artefakte des Build-Laufs herunterladen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p art
          gh run download 42168081051 --repo "$GITHUB_REPOSITORY" --dir art --name Seniorenverwaltung-Betreuer-Debug-APK --name Senioren-Launcher-Debug-APK
          find art -name '*.apk' -exec ls -l {} \;

      - name: APKs in den Branch legen
        run: |
          mkdir -p apk
          cp "$(find art -name '*.apk' | grep -i betreuer | head -1)" apk/Seniorenverwaltung-Betreuer-debug.apk
          cp "$(find art -name '*.apk' | grep -vi betreuer | head -1)" apk/Senioren-Launcher-debug.apk
          ls -lh apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apk
          git commit -m "APKs bereitstellen (temporär)"
          git push origin "HEAD:${{ github.head_ref }}"
