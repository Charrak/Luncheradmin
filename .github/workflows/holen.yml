name: APK holen (temporär)

on:
  pull_request:

permissions:
  contents: write
  actions: read

jobs:
  holen:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Artefakt laden
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p art
          gh run download 42183095348 --repo "$GITHUB_REPOSITORY" --dir art --name Seniorenverwaltung-Betreuer-Debug-APK
          find art -name '*.apk' -exec ls -l {} \;
      - name: APK mit Versionskennung ablegen
        run: |
          mkdir -p out
          cp "$(find art -name '*.apk' | head -1)" out/Seniorenverwaltung-Betreuer-debug-maps.apk
          ls -lh out
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add out
          git commit -m "APK mit Maps-Button (temporär)"
          git push origin "HEAD:${{ github.head_ref }}"
