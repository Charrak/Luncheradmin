name: Diagnose Betreuer-Build

on:
  pull_request:
    paths:
      - 'SeniorenBeheerder/**'

permissions:
  contents: write

jobs:
  log:
    if: github.event.pull_request.number == 2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: jetbrains
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36.1' 'build-tools;36.0.0' 'build-tools;36.1.0'
      - uses: gradle/actions/setup-gradle@v6
      - name: Build mit Logdatei
        working-directory: SeniorenBeheerder
        continue-on-error: true
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2 \
            -Dorg.gradle.jvmargs="-Xmx3g -Dfile.encoding=UTF-8" \
            -Pkotlin.compiler.execution.strategy=in-process > ../build.log 2>&1
          echo "exit=$?" >> ../build.log
      - name: Log in den Branch schreiben
        run: |
          tail -c 60000 build.log > diagnose.log
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add diagnose.log
          git commit -m "diagnose: Build-Log (temporär)" || true
          git push origin "HEAD:${{ github.head_ref }}"
